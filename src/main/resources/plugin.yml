name: RVCore
version: '${version}'

main: ca.risingvocal.rvcore.RVCore
description: risingvocal.ca Core Plugin
author: rising308
website: https://www.risingvocal.ca
api-version: '26.3'
depend: [Vault]
softdepend: ["Essentials","PlaceholderAPI"]
libraries:
  - com.mysql:mysql-connector-j:9.7.0
load: POSTWORLD

permissions:
  rvcore.command.admin:
    description: "Administrator permissions"
    default: op
    children:
      rvcore.command.admin.reload: true
      rvcore.command.admin.sweepstakes: true

